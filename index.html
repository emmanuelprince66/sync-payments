<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#242424" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sync Pay" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sync360 Payments — accounts, transfers, terminals, expenses and approvals in one dashboard." />
    <title>Sync360 Payments</title>
    <!-- Paint the app background immediately so there is never a white flash before React loads. -->
    <style>
      html, body { margin: 0; background: #F6F7F8; }
      .boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      .boot span { width: 34px; height: 34px; border-radius: 999px; border: 3px solid #FF7F00; border-top-color: transparent; animation: boot-spin .8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Loading"><span></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
